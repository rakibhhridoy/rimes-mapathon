# West-central: Kushtia, Chuadanga, Meherpur, Jhenaidah, Magura, Jessore, Narail.
# A region of the national partition (configs/national/partition.yaml),
# defined by its districts. Events from configs/national/events/west_central.yaml, whose
# windows were checked over these districts with scripts/check_s1_events.py.
# Only the differences from the base config live here.
extends: ../../config.yaml
paths:
  raw_dir: data/west_central/raw
  processed_dir: data/west_central/processed
  output_dir: data/west_central/output
aoi:
  name: west_central
  divisions: []
  bbox:
  - 88.51
  - 22.75
  - 89.86
  - 24.24
  districts:
  - Kushtia
  - Chuadanga
  - Meherpur
  - Jhenaidah
  - Magura
  - Jessore
  - Narail
  crs: EPSG:32646
  grid_resolution_m: 500
asset_model:
  past_flooding: false
data:
  osm:
    source: pbf
    pbf_path: data/shared/osm/bangladesh-2026-09-30.osm.pbf
  labels:
    min_events: 1
  dem:
    path: data/west_central/raw/dem_srtm_30m.tif
  admin_boundaries:
    union: data/west_central/raw/bgd_union.gpkg
    upazila: data/west_central/raw/bgd_upazila.gpkg
    district: data/west_central/raw/bgd_district.gpkg
  vulnerability:
    population_path: data/west_central/raw/worldpop_popdens.tif
sentinel1:
  events:
  - name: sep2024_jessore
    start: '2024-09-13'
    end: '2024-09-30'
    baseline_start: '2024-02-01'
    baseline_end: '2024-03-15'
    source: https://www.dhakatribune.com/bangladesh/nation/358517/low-lying-areas-inundated-in-jessore-due-to
  - name: jul2025_bhabodah
    start: '2025-07-25'
    end: '2025-08-25'
    baseline_start: '2025-02-01'
    baseline_end: '2025-03-15'
    source: https://www.dhakatribune.com/bangladesh/nation/389621/waterlogged-and-forgotten-over-5l-trapped-in
dashboard:
  map_center:
  - 23.49
  - 89.18
  map_zoom: 8
