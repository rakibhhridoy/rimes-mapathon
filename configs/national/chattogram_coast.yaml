# Chattogram coast: Chittagong, Cox's Bazar.
# A region of the national partition (configs/national/partition.yaml),
# defined by its districts. Events from configs/national/events/chattogram_coast.yaml, whose
# windows were checked over these districts with scripts/check_s1_events.py.
# Only the differences from the base config live here.
extends: ../../config.yaml
paths:
  raw_dir: data/chattogram_coast/raw
  processed_dir: data/chattogram_coast/processed
  output_dir: data/chattogram_coast/output
aoi:
  name: chattogram_coast
  divisions: []
  bbox:
  - 91.26
  - 20.54
  - 92.4
  - 23.04
  districts:
  - Chittagong
  - Cox's Bazar
  crs: EPSG:32646
  grid_resolution_m: 500
asset_model:
  past_flooding: false
data:
  osm:
    source: pbf
    pbf_path: data/shared/osm/bangladesh-2026-09-30.osm.pbf
  labels:
    min_events: 1
  dem:
    path: data/chattogram_coast/raw/dem_srtm_30m.tif
  admin_boundaries:
    union: data/chattogram_coast/raw/bgd_union.gpkg
    upazila: data/chattogram_coast/raw/bgd_upazila.gpkg
    district: data/chattogram_coast/raw/bgd_district.gpkg
  vulnerability:
    population_path: data/chattogram_coast/raw/worldpop_popdens.tif
sentinel1:
  events:
  - name: aug2023_chattogram
    start: '2023-08-05'
    end: '2023-08-15'
    baseline_start: '2023-02-01'
    baseline_end: '2023-03-15'
    source: https://reliefweb.int/report/bangladesh/bangladesh-chattogram-division-flash-flood-and-monsoon-rain-2023-situation-report-no-01-13-august-2023
  - name: aug2024_eastern
    start: '2024-08-20'
    end: '2024-09-05'
    baseline_start: '2024-02-01'
    baseline_end: '2024-03-15'
    source: https://bangladesh.un.org/sites/default/files/2024-08/SitRep%2002%20Eastern%20Flash%20Flood.pdf
  - name: may2024_remal
    start: '2024-05-26'
    end: '2024-06-01'
    baseline_start: '2024-02-01'
    baseline_end: '2024-03-15'
    source: https://reliefweb.int/report/bangladesh/bangladesh-cyclone-remal-2024-situation-report-no-03-29-may-2024
dashboard:
  map_center:
  - 21.79
  - 91.83
  map_zoom: 8
