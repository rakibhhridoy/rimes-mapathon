# Central: Dhaka, Gazipur, Narsingdi, Narayanganj, Munshiganj, Manikganj, Faridpur, Rajbari, Madaripur, Shariatpur, Gopalganj, Chandpur.
# A region of the national partition (configs/national/partition.yaml),
# defined by its districts. Events from configs/national/events/central.yaml, whose
# windows were checked over these districts with scripts/check_s1_events.py.
# Only the differences from the base config live here.
extends: ../../config.yaml
paths:
  raw_dir: data/central/raw
  processed_dir: data/central/processed
  output_dir: data/central/output
aoi:
  name: central
  divisions: []
  bbox:
  - 89.25
  - 22.8
  - 91.08
  - 24.39
  districts:
  - Dhaka
  - Gazipur
  - Narsingdi
  - Narayanganj
  - Munshiganj
  - Manikganj
  - Faridpur
  - Rajbari
  - Madaripur
  - Shariatpur
  - Gopalganj
  - Chandpur
  crs: EPSG:32646
  grid_resolution_m: 500
asset_model:
  past_flooding: false
data:
  osm:
    source: pbf
    pbf_path: data/shared/osm/bangladesh-2026-09-30.osm.pbf
  labels:
    min_events: 2
  dem:
    path: data/central/raw/dem_srtm_30m.tif
  admin_boundaries:
    union: data/central/raw/bgd_union.gpkg
    upazila: data/central/raw/bgd_upazila.gpkg
    district: data/central/raw/bgd_district.gpkg
  vulnerability:
    population_path: data/central/raw/worldpop_popdens.tif
sentinel1:
  events:
  - name: aug2017
    start: '2017-08-15'
    end: '2017-08-31'
    baseline_start: '2017-02-01'
    baseline_end: '2017-03-15'
    source: https://reliefweb.int/report/bangladesh/bangladesh-flood-situation-august-22-2017
  - name: jul2019
    start: '2019-07-18'
    end: '2019-08-02'
    baseline_start: '2019-02-01'
    baseline_end: '2019-03-15'
    source: https://reliefweb.int/report/bangladesh/bangladesh-monsoon-flood-2019-situation-report-5-19-july-2019
  - name: jul2020
    start: '2020-07-15'
    end: '2020-08-10'
    baseline_start: '2020-02-01'
    baseline_end: '2020-03-15'
    source: https://reliefweb.int/report/bangladesh/bangladesh-monsoon-flood-2020-situation-report-4-30-july-2020
dashboard:
  map_center:
  - 23.6
  - 90.16
  map_zoom: 8
