# Eastern plains: Comilla, Feni, Noakhali and Lakshmipur, between the Meghna
# estuary and the Tripura hills. Flash floods come off the hills, surge and
# tide reach the coast, and water stands for weeks in Noakhali and Lakshmipur.
#
# The first region added for national coverage (docs/national/). It is
# defined by its districts rather than by its box alone, so it does not hold
# the assets of the regions around it. Its events are checked against the
# reports and Sentinel-1 passes in docs/national/eastern_plains_events.md.
#
# Only the differences from the base config live here.
extends: ../config.yaml

paths:
  raw_dir: "data/eastern_plains/raw"
  processed_dir: "data/eastern_plains/processed"
  output_dir: "data/eastern_plains/output"

aoi:
  name: "eastern_plains"
  divisions: ["Chittagong"]
  bbox: [90.6, 22.0, 91.6, 23.8]
  districts: ["Comilla", "Feni", "Noakhali", "Lakshmipur"]
  crs: "EPSG:32646"
  grid_resolution_m: 500

# Every usable event is from 2024, so there is no earlier record to give the
# model as a feature (and no temporal test; see the events file).
asset_model:
  past_flooding: false

data:
  # Assets come from Geofabrik's national OpenStreetMap extract of 30 Sep 2026,
  # read locally, because the public Overpass servers throttled this region's
  # queries (2026-10-01). The first three regions used Overpass in September.
  osm:
    source: "pbf"
    pbf_path: "data/shared/osm/bangladesh-2026-09-30.osm.pbf"
  labels:
    # Flash floods inland and surge on the coast overlap little, so ground
    # counts as flood-prone if any mapped event flooded it, as on the
    # south-west coast.
    min_events: 1
  dem:
    path: "data/eastern_plains/raw/dem_srtm_30m.tif"
  admin_boundaries:
    union: "data/eastern_plains/raw/bgd_union.gpkg"
    upazila: "data/eastern_plains/raw/bgd_upazila.gpkg"
    district: "data/eastern_plains/raw/bgd_district.gpkg"
  vulnerability:
    population_path: "data/eastern_plains/raw/worldpop_popdens.tif"

sentinel1:
  events:
    - name: "aug2024_eastern"
      start: "2024-08-20"
      end: "2024-09-05"
      baseline_start: "2024-02-01"
      baseline_end: "2024-03-15"
      source: "https://bangladesh.un.org/sites/default/files/2024-08/SitRep%2002%20Eastern%20Flash%20Flood.pdf"
    - name: "may2024_remal"
      start: "2024-05-26"
      end: "2024-06-01"
      baseline_start: "2024-02-01"
      baseline_end: "2024-03-15"
      source: "https://reliefweb.int/report/bangladesh/bangladesh-cyclone-remal-2024-situation-report-no-03-29-may-2024"
    - name: "jul2024_feni"
      start: "2024-07-01"
      end: "2024-07-12"
      baseline_start: "2024-02-01"
      baseline_end: "2024-03-15"
      source: "https://www.dhakatribune.com/bangladesh/nation/350839/muhuri-river-embankment-collapse-triggers-severe"

dashboard:
  map_center: [22.9, 91.1]
  map_zoom: 9
