# The national west central region as an independent validation region for the
# comparison with the flood record. Assets the study boxes also hold are
# dropped, so no asset is scored in both. Built by
# scripts/make_validation_region.py.
extends: ../national/west_central.yaml
paths:
  raw_dir: data/west_central_ind/raw
  processed_dir: data/west_central_ind/processed
  output_dir: data/west_central_ind/output
data:
  # Distances run to the facilities of the whole national region, not only
  # to those among the assets kept here.
  facilities_path: data/west_central/raw/infrastructure_raw.gpkg
