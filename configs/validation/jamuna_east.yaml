# Jamuna east bank (Sherpur, Jamalpur, Mymensingh, Tangail) as an independent
# validation region for the comparison with the flood record. The national
# region shares mapped assets with the Rangpur-Rajshahi study box, which
# crosses the Jamuna, and with the Sylhet box; those are dropped here, so no
# asset is scored in both. Built by scripts/make_validation_region.py.
extends: ../national/jamuna_east.yaml
paths:
  raw_dir: data/jamuna_east_ind/raw
  processed_dir: data/jamuna_east_ind/processed
  output_dir: data/jamuna_east_ind/output
data:
  # Distances run to the facilities of the whole national region, not only
  # to those among the assets kept here.
  facilities_path: data/jamuna_east/raw/infrastructure_raw.gpkg
