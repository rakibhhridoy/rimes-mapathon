; GDAL OSM driver settings for reading a national OpenStreetMap extract
; (pipeline/data_ingest.py, `data.osm.source: pbf`). Only the tag keys the
; asset groups ask for are kept as columns, so the extract reads quickly and
; the result has the shape the Overpass path produces.
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism
attribute_name_laundering=yes

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,amenity,man_made,waterway,highway,railway,bridge,landuse
other_tags=no
all_tags=no

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,amenity,man_made,waterway,highway,railway,bridge,landuse
other_tags=no
all_tags=no

