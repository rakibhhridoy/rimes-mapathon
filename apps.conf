# Fermium HazMapper — public deployment behind nginx.
#
# Serves the web application (FastAPI + MapLibre, hazmapper-web.service on
# port 2030) at https://fermium.systems/hazmapper/. The Streamlit dashboard it
# replaced is retired; its unit file stays in the repository for local use.
#
# The rate-limit and connection zones must live in the http{} context. If this
# file is included from inside http{} (the usual conf.d/ or sites-enabled/
# layout) they can stay here; otherwise move the two *_zone lines to
# nginx.conf and keep the rest.

# The map reads vector tiles as HTTP range requests, so panning issues bursts
# of small requests: the limits are looser than the Streamlit ones were, while
# still capping any one address.
limit_req_zone $binary_remote_addr zone=hazmapper_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=hazmapper_conn:10m;

upstream hazmapper_web {
    server 127.0.0.1:2030;
    keepalive 32;
}

server {
    listen 80;
    server_name fermium.systems;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fermium.systems;

    ssl_certificate /etc/letsencrypt/live/fermium.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fermium.systems/privkey.pem;

    client_max_body_size 1M;

    # Security headers. MapLibre fetches basemap and elevation tiles with
    # fetch(), so their hosts belong in connect-src as well as img-src, and it
    # runs its workers from blob: URLs.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' https://cdn.jsdelivr.net; \
worker-src 'self' blob:; child-src blob:; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; \
font-src 'self' https://fonts.gstatic.com; \
img-src 'self' data: blob: https://server.arcgisonline.com https://s3.amazonaws.com; \
connect-src 'self' https://server.arcgisonline.com https://s3.amazonaws.com; \
frame-ancestors 'self'; base-uri 'self'" always;

    # The page uses relative URLs, so it must be loaded with a trailing slash.
    location = /hazmapper {
        return 301 /hazmapper/;
    }

    location /hazmapper/ {
        limit_req zone=hazmapper_req burst=120 nodelay;
        limit_conn hazmapper_conn 24;

        # The trailing slash strips /hazmapper/ before the request reaches the
        # app, which serves from its own root.
        proxy_pass http://hazmapper_web/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Range requests for the tiles must pass through untouched.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 60;
    }
}
