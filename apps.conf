# Fermium HazMapper — public deployment behind nginx.
#
# The rate-limit and connection zones must live in the http{} context. If this
# file is included from inside http{} (the usual conf.d/ or sites-enabled/
# layout) they can stay here; otherwise move the three *_zone lines to
# nginx.conf and keep the rest.

# One shared zone per client IP. Streamlit holds a websocket open per browser
# tab and keeps that session's data in memory, so an open public URL is easy
# to overload: cap new requests and concurrent connections per IP.
limit_req_zone $binary_remote_addr zone=hazmapper_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=hazmapper_conn:10m;

upstream hazmapper {
    server 127.0.0.1:2020;
    keepalive 32;
}

server {
    listen 80;
    server_name fermium.systems;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fermium.systems;

    ssl_certificate /etc/letsencrypt/live/fermium.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fermium.systems/privkey.pem;

    client_max_body_size 1M;

    # Security headers. The dashboard injects inline styles and scripts and
    # loads Google Fonts plus map tiles, so the CSP has to allow those origins.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; \
font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; \
img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://*.tile.openstreetmap.org; \
connect-src 'self' wss://fermium.systems; \
frame-ancestors 'self'; base-uri 'self'" always;

    location /hazmapper {
        limit_req zone=hazmapper_req burst=30 nodelay;
        limit_conn hazmapper_conn 12;

        proxy_pass http://hazmapper/hazmapper;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Websocket endpoint for the Streamlit session. No request-rate limit here:
    # it is one long-lived connection per tab, already capped by limit_conn.
    location /hazmapper/_stcore/stream {
        limit_conn hazmapper_conn 12;

        proxy_pass http://hazmapper/hazmapper/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
