# Fermium Hazard Mapper: the nginx parts, for reference.
#
# On the server these sit inside the shared nginx file that also serves the
# rest of fermium.systems: the zone and upstream lines at the top level of the
# file (nginx's http context), and the two locations inside the
# `server_name fermium.systems` block that listens on 443. The service they
# proxy to is hazmapper.service, on port 2030.

# Fermium Hazard Mapper: the FastAPI web app (hazmapper.service, port 2030).
# The map reads vector tiles as bursts of HTTP range requests, so the limits
# allow short bursts while capping any one address.
limit_req_zone $binary_remote_addr zone=hazmapper_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=hazmapper_conn:10m;

upstream hazmapper {
    server 127.0.0.1:2030;
    keepalive 16;
}

# --- inside: server { listen 443 ssl; server_name fermium.systems; ... }

# The map page uses relative URLs, so it must be loaded with a trailing slash.
location = /hazmapper {
    return 301 /hazmapper/;
}

location /hazmapper/ {
    limit_req zone=hazmapper_req burst=120 nodelay;
    limit_conn hazmapper_conn 24;

    # The trailing slash strips /hazmapper/ before the request reaches
    # the app, which serves from its own root.
    proxy_pass http://hazmapper/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60;

    # Headers set here apply to the map only, not to the rest of the site.
    # MapLibre fetches basemap and elevation tiles with fetch() and runs
    # its workers from blob: URLs.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; worker-src 'self' blob:; child-src blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com https://s3.amazonaws.com; connect-src 'self' https://server.arcgisonline.com https://s3.amazonaws.com https://cdn.jsdelivr.net https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'" always;
}
